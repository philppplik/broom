name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path Broom.ps1 -Pattern "\`$script:Version\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "Broom.ps1 says $ver but tag is $tag" }

      - name: Static checks
        shell: pwsh
        run: ./tools/Test-Broom.ps1 -SkipAnalyzer

      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/broom | Out-Null
          Copy-Item Broom.ps1, Broom.cmd, README.md, LICENSE, CHANGELOG.md dist/broom/
          Compress-Archive dist/broom/* dist/broom.zip
          Copy-Item dist/broom.zip "dist/broom-${{ github.ref_name }}.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Extract release notes
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $md = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## \[|\n\[[^\]]+\]:|\z)")
          ($m.Groups[1].Value.Trim() + "`n`n**Install:** download ``broom.zip``, extract, double-click ``Broom.cmd``.") | Set-Content dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' dist/broom.zip "dist/broom-${{ github.ref_name }}.zip" dist/SHA256SUMS.txt --title "Broom ${{ github.ref_name }}" --notes-file dist/notes.md --verify-tag
