name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry:
        description: Build all packages without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { arch: arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust if missing
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/pkg
          cp target/release/broom.exe README.md LICENSE THIRD-PARTY-NOTICES.md CHANGELOG.md dist/pkg/
          cd dist/pkg && 7z a -tzip ../broom-windows-${{ matrix.arch }}.zip . >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x64, os: ubuntu-22.04 }
          - { arch: arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust if missing
        run: command -v cargo || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - run: cargo build --release --locked
      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Package (.tar.gz, .deb, .rpm)
        run: |
          mkdir -p dist
          tar -czf dist/broom-linux-${{ matrix.arch }}.tar.gz -C target/release broom -C "$PWD" README.md LICENSE THIRD-PARTY-NOTICES.md
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macOS universal (.dmg)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/broom target/aarch64-apple-darwin/release/broom target/x86_64-apple-darwin/release/broom
          lipo -info dist/broom
      - name: Package (.dmg with Broom.app + .tar.gz)
        run: |
          VER="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          bash packaging/macos/make-dmg.sh dist/broom "$VER" dist/broom-macos-universal.dmg
          tar -czf dist/broom-macos-universal.tar.gz -C dist broom -C "$PWD" README.md LICENSE THIRD-PARTY-NOTICES.md
          rm dist/broom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*

  publish:
    name: Publish release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Check version matches tag
        if: github.ref_type == 'tag'
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml says $v but tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Release notes from CHANGELOG
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} /^\[[^]]+\]:/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          | Platform | File |
          |---|---|
          | Windows x64 (Intel/AMD) | `broom-windows-x64.zip` |
          | Windows ARM64 (Snapdragon) | `broom-windows-arm64.zip` |
          | macOS (Apple Silicon + Intel) | `broom-macos-universal.dmg` or `.tar.gz` |
          | Debian / Ubuntu | `broom_*_amd64.deb` / `broom_*_arm64.deb` |
          | Fedora / openSUSE / RHEL | `broom-*.x86_64.rpm` / `broom-*.aarch64.rpm` |
          | Any Linux | `broom-linux-x64.tar.gz` / `broom-linux-arm64.tar.gz` |

          Verify with `SHA256SUMS.txt`. One-line installers are in the README.
          EOF
          cat notes.md
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Broom $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
