name: Bug report
description: Something was cleaned that shouldn't be, or Broom crashed / misbehaved
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems** (e.g. user data deleted, junctions followed) go to a [private advisory](https://github.com/philppplik/broom/security/advisories/new) instead.
  - type: input
    id: version
    attributes: { label: Broom version, placeholder: '2.0.0' }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Windows 11, Windows 10, macOS, Linux] }
    validations: { required: true }
  - type: input
    id: osver
    attributes: { label: OS version / distro, placeholder: 'Windows 11 Pro 25H2 (26200.xxxx) / macOS 26.1 / Ubuntu 24.04' }
    validations: { required: true }
  - type: dropdown
    id: arch
    attributes: { label: Architecture, options: [x64, ARM64] }
    validations: { required: true }
  - type: input
    id: item
    attributes: { label: Which item / mode?, placeholder: 'Deep Clean > App caches' }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From C:\ProgramData\Broom\Logs\broom-*.log. Remove anything private.
      render: text
